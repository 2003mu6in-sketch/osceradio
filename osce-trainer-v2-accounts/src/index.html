<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Masterpiece OSCE &amp; MCQ Trainer</title>
  <meta name="description" content="Masterpiece OSCE pictures and MCQs – radiology, anaesthesia, ophthalmology and ENT – with an error log and spaced review.">
  <meta name="theme-color" content="#0e1114">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script>
    // apply the saved theme before first paint (no flash)
    try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  %CSS%
</head>
<body>
  <div id="root"></div>
  <noscript>This app needs JavaScript.</noscript>
  %JS%
</body>
</html>
