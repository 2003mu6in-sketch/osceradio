<title>OSCE Picture Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky filter bar over a single reading column of question cards, like an exam script marked in the margin. */
:root{
  --bg:#f6f7f8; --surface:#ffffff; --fg:#1b2026; --muted:#5d6670; --line:#dde1e5;
  --accent:#1f5f8b; --accent-soft:#e3eef6;
  --right:#17703f; --right-soft:#e3f3e9; --warn:#8a5a00; --warn-soft:#fbf0d9; --bad:#a1302a; --bad-soft:#fbe6e4;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171b; --surface:#1b2026; --fg:#e7eaed; --muted:#9aa4ae; --line:#2c333a;
  --accent:#7ab4dc; --accent-soft:#1c3142;
  --right:#6cc895; --right-soft:#15301f; --warn:#e2b45a; --warn-soft:#33280f; --bad:#ef8a83; --bad-soft:#3a1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171b; --surface:#1b2026; --fg:#e7eaed; --muted:#9aa4ae; --line:#2c333a;
  --accent:#7ab4dc; --accent-soft:#1c3142;
  --right:#6cc895; --right-soft:#15301f; --warn:#e2b45a; --warn-soft:#33280f; --bad:#ef8a83; --bad-soft:#3a1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 12px}
h1{font:600 1.75rem/1.2 var(--serif);margin:0 0 6px;text-wrap:balance}
.lede{color:var(--muted);max-width:65ch;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:.85rem;color:var(--muted)}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding-block:10px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{font:500 .85rem var(--sans);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
select,input[type=search]{font:inherit;font-size:.85rem;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-width:0}
input[type=search]{flex:1 1 160px}
.count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:12px;padding-block:16px 48px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:.78rem;color:var(--muted)}
.meta code{font:500 .78rem var(--mono);color:var(--fg)}
.chip{font:500 .72rem var(--sans);padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.lead{font-size:.9rem;color:var(--muted);white-space:pre-line;border-left:2px solid var(--line);padding-left:10px}
.stem{font:400 1.02rem/1.45 var(--serif);white-space:pre-line;overflow-wrap:anywhere}
ol.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.opts li{display:grid;grid-template-columns:1.6em 1fr auto;gap:6px;padding:4px 8px;border-radius:5px;overflow-wrap:anywhere}
.opts .k{font:500 .85rem var(--mono);color:var(--muted)}
.opts li.ok{background:var(--right-soft)}
.opts li.ok .k,.opts li.ok .mark{color:var(--right)}
.opts li.alt{background:var(--warn-soft)}
.opts li.alt .k,.opts li.alt .mark{color:var(--warn)}
.mark{font-size:.75rem;font-weight:600;white-space:nowrap}
.notes{font-size:.85rem;color:var(--muted);margin:0;padding-left:18px}
.ans{font-size:.9rem}
.more{align-self:center;font:500 .85rem var(--sans);padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:32px 0}
@media (max-width:520px){.count{margin-left:0;width:100%}}
.figs{display:flex;flex-wrap:wrap;gap:8px}
.figs img{max-height:220px;width:auto;max-width:100%;border-radius:4px;border:1px solid var(--line);background:var(--bg)}
.figs.ans img{max-height:150px}
.prompts{margin:0;padding-left:22px;font:400 1rem/1.45 var(--serif)}
.answer{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px;font-size:.92rem;overflow-wrap:anywhere}
.answer .l{white-space:pre-line}
details.refs{font-size:.8rem;color:var(--muted)}
.label{font:600 .72rem var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.notecard .l{font-size:.9rem}
</style>


<header class="top"><div class="wrap">
  <h1>OSCE picture check</h1>
  <p class="lede">Every new OSCE card for Anaesthesia, ENT and Ophthalmology, as the app will show it: question picture and prompts first, then the answer. Prompts marked <em>transcribed</em> were typed from the projector slide.</p>
  <div class="stats" id="stats"></div>
</div></header>
<div class="bar"><div class="wrap">
  <div class="tabs" id="tabs" role="group" aria-label="Subject"></div>
  <select id="paper" aria-label="Paper"></select>
  <select id="flag" aria-label="Show">
    <option value="">All cards</option>
    <option value="transcribed">Transcribed prompts</option>
    <option value="merged">Merged repeats</option>
    <option value="textOnly">No question picture</option>
    <option value="noAnswer">No answer in source</option>
    <option value="notes">Revision notes (not quizzed)</option>
  </select>
  <input type="search" id="q" placeholder="Search" aria-label="Search">
  <label style="font-size:.85rem;display:flex;gap:6px;align-items:center"><input type="checkbox" id="hide"> Hide answers</label>
  <span class="count" id="count"></span>
</div></div>
<main class="wrap" id="list"></main>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const SUBJ = [["anaesthesia","Anaesthesia"],["ophthalmology","Ophthalmology"],["ent","ENT"]];
const PAGE = 40;
let st = {subject:"anaesthesia", paper:"", flag:"", q:"", hide:false, shown:PAGE};
try{ const s=JSON.parse(localStorage.getItem("osce-qa")||"null"); if(s) st={...st,...s,shown:PAGE}; }catch(e){}
const save=()=>{ try{ localStorage.setItem("osce-qa", JSON.stringify({subject:st.subject,paper:st.paper,flag:st.flag,hide:st.hide})); }catch(e){} };
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img=id=>D.img[id]?`<img src="${D.img[id]}" alt="Picture ${esc(id)}" loading="lazy">`:"";
const all=Object.values(D.subjects).flatMap(s=>s.cards);
document.getElementById("stats").innerHTML=[["cards",all.length],["transcribed prompts",all.filter(c=>c.promptSource==="transcribed").length],
 ["merged repeats",all.filter(c=>c.appearsIn.length>1).length],["no question picture",all.filter(c=>c.textOnly).length],
 ["revision notes",Object.values(D.subjects).reduce((a,s)=>a+s.notes.length,0)]].map(([l,v])=>`<span><b>${v}</b> ${l}</span>`).join("");
const tabs=document.getElementById("tabs");
tabs.innerHTML=SUBJ.map(([k,l])=>`<button class="tab" data-s="${k}" aria-pressed="false">${l} <span style="opacity:.7">${D.subjects[k].cards.length}</span></button>`).join("");
tabs.onclick=e=>{const b=e.target.closest(".tab"); if(!b) return; st.subject=b.dataset.s; st.paper=""; st.shown=PAGE; sync();};
const P=document.getElementById("paper"),F=document.getElementById("flag"),Q=document.getElementById("q"),H=document.getElementById("hide");
P.onchange=()=>{st.paper=P.value;st.shown=PAGE;render();save();};
F.onchange=()=>{st.flag=F.value;st.shown=PAGE;render();save();};
Q.oninput=()=>{st.q=Q.value.trim().toLowerCase();st.shown=PAGE;render();};
H.onchange=()=>{st.hide=H.checked;render();save();};
function ok(c){
  if(st.paper && c.paper.split(" Set")[0]!==st.paper) return false;
  const f=st.flag;
  if(f==="transcribed"&&c.promptSource!=="transcribed") return false;
  if(f==="merged"&&c.appearsIn.length<2) return false;
  if(f==="textOnly"&&!c.textOnly) return false;
  if(f==="noAnswer"&&!c.noAnswer) return false;
  if(st.q){const h=(c.id+" "+(c.stem||"")+" "+c.prompts.join(" ")+" "+c.answer.join(" ")).toLowerCase(); if(!h.includes(st.q)) return false;}
  return true;
}
function card(c){
  const chips=[];
  if(c.promptSource==="transcribed") chips.push(`<span class="chip info">transcribed</span>`);
  if(c.promptSource==="generic") chips.push(`<span class="chip warn">generic prompt</span>`);
  if(c.noAnswer) chips.push(`<span class="chip bad">No answer in source</span>`);
  return `<article class="q">
   <div class="meta"><code>${esc(c.id)}</code><span>${esc(c.appearsIn.join(" · "))}</span><span>PDF p.${c.page}</span>${chips.join("")}</div>
   ${c.images.length?`<div class="figs">${c.images.map(img).join("")}</div>`:""}
   ${c.stem?`<div class="stem">${esc(c.stem)}</div>`:""}
   <ol class="prompts">${c.prompts.map(p=>`<li style="white-space:pre-line">${esc(p)}</li>`).join("")}</ol>
   ${st.hide?"":`<div class="answer"><span class="label">Answer${c.diagnosis?" · "+esc(c.diagnosis):""}</span>
     ${c.answer.map(l=>`<span class="l">${esc(l)}</span>`).join("")}
     ${c.answerImages.length?`<div class="figs ans">${c.answerImages.map(img).join("")}</div>`:""}
     ${c.altAnswers.length?c.altAnswers.map(a=>`<details class="refs"><summary>Answer given in ${esc(a.source)}</summary>${a.lines.map(esc).join("<br>")}</details>`).join(""):""}
     ${c.notes.length?`<ul class="notes">${c.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}
     ${c.refs.length?`<details class="refs"><summary>References</summary>${c.refs.map(esc).join("<br>")}</details>`:""}
   </div>`}
  </article>`;
}
function note(n){
  return `<article class="q notecard"><div class="meta"><code>${esc(n.id)}</code><span class="chip info">revision notes</span></div>
   <div class="stem">${esc(n.title)}</div>${n.images.length?`<div class="figs">${n.images.map(img).join("")}</div>`:""}
   <div class="answer">${n.lines.map(l=>`<span class="l">${esc(l)}</span>`).join("")}</div></article>`;
}
function sync(){
  [...tabs.children].forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.s===st.subject)));
  const papers=[...new Set(D.subjects[st.subject].cards.map(c=>c.paper.split(" Set")[0]))];
  if(st.paper&&!papers.includes(st.paper)) st.paper="";
  P.innerHTML=`<option value="">All papers</option>`+papers.map(p=>`<option ${p===st.paper?"selected":""}>${esc(p)}</option>`).join("");
  F.value=st.flag; H.checked=st.hide; render(); save();
}
function render(){
  const s=D.subjects[st.subject], el=document.getElementById("list");
  if(st.flag==="notes"){ document.getElementById("count").textContent=`${s.notes.length} shown`; el.innerHTML=s.notes.map(note).join("")||`<p class="empty">No revision notes for this subject.</p>`; return; }
  const list=s.cards.filter(ok);
  document.getElementById("count").textContent=`${list.length} shown`;
  el.innerHTML=list.length?list.slice(0,st.shown).map(card).join("")+(list.length>st.shown?`<button class="more" id="more">Show ${Math.min(PAGE,list.length-st.shown)} more</button>`:""):`<p class="empty">No cards match these filters.</p>`;
  const m=document.getElementById("more"); if(m) m.onclick=()=>{st.shown+=PAGE;render();};
}
sync();
</script>
