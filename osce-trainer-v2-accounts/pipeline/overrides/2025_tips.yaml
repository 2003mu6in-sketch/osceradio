  TIPS-29:
    prompts: ["Sarcoidosis – name the radiographic (Scadding) stages shown on chest radiographs."]
    answer:
      - "Stage 0 – normal chest radiograph"
      - "Stage 1 – bilateral hilar lymphadenopathy"
      - "Stage 2 – bilateral hilar lymphadenopathy with pulmonary infiltration"
      - "Stage 3 – pulmonary infiltration without hilar lymphadenopathy"
      - "Stage 4 – advanced pulmonary fibrosis (end-stage lung disease)"
    notes:
      - "All stages except stage 4 have spontaneous resolution rates."
      - "Stage 1 has the highest frequency, with the highest rate (60–90%) of spontaneous resolution."
      - "Stage 4 has no spontaneous resolution (0%)."
      - "Look out for the chest radiograph signs of: situs inversus, sarcoidosis, consolidation, pneumonia, pneumothorax."
    diagnosis: Sarcoidosis – radiographic staging
    modality: X-ray
