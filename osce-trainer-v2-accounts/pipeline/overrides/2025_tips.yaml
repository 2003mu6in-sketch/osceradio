  TIPS-43:
    prompts: ["Describe this chest radiograph systematically.", "Where is the abnormality and what is it?"]
    answer:
      - "Left lobar consolidation."
      - "A: The trachea is central and no foreign body can be seen; the carina can be visualised."
      - "B: There is a hazy opacification in the middle to lower zones of the left lung; the right lung appears clear."
      - "C: The heart appears normal, occupying less than 50% of the internal thoracic diameter."
      - "D: The costophrenic angles are present and sharp."
      - "E: There are no visible fractures, soft tissue injuries or devices."
    notes:
      - "Consolidation = filling of alveolar spaces with fluid, pus, blood or other substances → increased lung density."
      - "Signs: homogeneous opacity obscuring vessels; air bronchograms (most characteristic); silhouette sign; no significant volume loss; poorly defined margins, often lobar."
      - "Location: upper lobe may obscure the aortic arch (left); middle lobe obscures the right heart border; lower lobe obscures the diaphragm."
      - "Differentials – infective: pneumonia, TB, lung abscess (cavitation), mycoses. Inflammatory: organising pneumonia, eosinophilic pneumonia, GPA, alveolar sarcoid, hypersensitivity pneumonitis."
      - "Neoplastic: lepidic adenocarcinoma (bronchoalveolar carcinoma), lymphoma. Vascular: pulmonary infarction (wedge-shaped), pulmonary oedema (cardiogenic or ARDS)."
      - "Other: pulmonary haemorrhage (Goodpasture's, vasculitis), drug-induced (amiodarone), radiation pneumonitis."
      - "Clues: air bronchograms → infection; cavitation → TB/abscess/fungal; peripheral → eosinophilic/COP; upper lobe → TB/sarcoid/fungal; migratory → organising/eosinophilic pneumonia."
    diagnosis: Left lobar consolidation
    modality: X-ray
