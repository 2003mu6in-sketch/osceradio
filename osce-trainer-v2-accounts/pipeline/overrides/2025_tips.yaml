    prompts: ["Describe the findings on these barium swallow images.", "What is the diagnosis?", "Give other investigations, differentials and complications."]
    answer:
      - "Barium swallow images in a patient with achalasia: oesophageal dilatation with narrowing of the distal oesophagus – classic bird's-beak tapering at the lower oesophageal sphincter."
      - "One in a series of barium swallow images, lateral view, showing smooth tapering of the distal oesophagus with proximal dilatation, eliciting the bird-beak sign."
      - "Other investigations: upper GI endoscopy, CT scan, oesophageal manometry."
      - "Differentials: oesophageal carcinoma, diffuse oesophageal spasm, oesophageal diverticulum, oesophageal atresia, oesophageal stenosis."
      - "Complications of achalasia: oesophageal rupture, aspiration."
    diagnosis: Achalasia
