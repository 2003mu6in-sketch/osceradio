    prompts: ["What examination is this?", "Mention 1 important radiological finding.", "What is your diagnosis?"]
    diagnosis: Tracheo-oesophageal fistula
  2017-Q03:
    prompts: ["a. What is the imaging modality?", "b. List the grading of splenic injuries in blunt abdominal trauma."]
    diagnosis: Splenic injury (grading)
  2017-Q04:
    prompts: ["a. State the examination type", "b. Describe the pathology", "c. What is your diagnosis?"]
    diagnosis: Pulmonary oedema
  2017-Q05:
    prompts: ["Mention 2 important radiological findings.", "What is your diagnosis?"]
    diagnosis: Small bowel obstruction
  2017-Q06:
