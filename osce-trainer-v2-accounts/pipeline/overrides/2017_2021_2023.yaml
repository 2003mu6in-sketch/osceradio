  2017-Q19:
    prompts:
      - "a. What procedure is this?"
      - "b. Describe the findings"
      - "c. What is the diagnosis?"
      - "d. Give one complication of the condition"
      - "e. Mention one other imaging modality that can be done"
    diagnosis: Osteosarcoma
  2017-Q20:
    prompts:
      - "a. Identify the imaging modality"
      - "b. Describe the pathology"
      - "c. What is your diagnosis?"
      - "d. How many grades of the condition do we have?"
