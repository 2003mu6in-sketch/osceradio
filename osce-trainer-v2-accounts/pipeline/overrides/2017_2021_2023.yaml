    prompts: ["What examination is this?", "Mention 2 important radiological findings.", "What is your diagnosis?"]
    diagnosis: Horseshoe kidney
  2017-Q09:
    prompts:
      - "a. Identify this image (2)"
      - "b. Describe the pathology (4 marks)"
      - "c. What is the significance of the finding? (2 marks)"
      - "d. What other imaging modality can be done to better evaluate the condition? (2 marks)"
    diagnosis: Lipohaemarthrosis (occult intra-articular fracture)
  2017-Q10:
    stem: "Image of a 28-year-old male who reported at the emergency with abdominal pain 6 hours after involvement in an RTA."
    prompts:
      - "Identify the imaging modality"
      - "What is the arrow pointing at?"
      - "Mention two (2) limitations of the imaging modality"
      - "Mention one other imaging modality that can be used"
      - "What is the diagnosis?"
      - "Mention one differential diagnosis"
    diagnosis: Haemoperitoneum (free fluid in Morison's pouch)
  2017-Q11:
    stem: "Image of a 54-year-old male who reported with knee pain."
    prompts:
      - "a. Identify the image (2 marks)"
      - "b. Describe the pathology (6 marks)"
      - "c. What is the diagnosis? (2 marks)"
      - "d. What is a possible differential diagnosis? (1 mark)"
    diagnosis: Giant cell tumour with pathological fracture
  2017-Q12:
    prompts:
      - "Identify the image (1 mark)"
      - "Describe the pathology (4 marks)"
      - "What is the diagnosis? (1 mark)"
      - "What will be the harmful effect if this condition is not corrected? (2 marks)"
      - "What other imaging modality can be employed? (2 marks)"
    diagnosis: Severe hydronephrosis
  2017-Q13:
    prompts:
      - "a. Identify the image (1 mark)"
      - "b. Describe the pathology (4 marks)"
      - "c. What is the diagnosis? (2 marks)"
      - "d. Give the diagnosis and a differential diagnosis (2 marks)"
      - "e. Give one clinical presentation of this case (1 mark)"
    diagnosis: Achalasia
  2017-Q14:
    prompts:
      - "a. Identify the image (1 mark)"
      - "b. Describe the pathology (4 marks)"
      - "c. What is the diagnosis? (2 marks)"
      - "d. Give a differential diagnosis (2 marks)"
      - "e. Give one clinical presentation of this case (1 mark)"
    diagnosis: Posterior urethral valves
  2017-Q15:
    prompts:
      - "a. Identify the image (2 marks)"
      - "b. Describe the pathology (4 marks)"
      - "c. What is the diagnosis? (2 marks)"
      - "d. Give a differential diagnosis (2 marks)"
    diagnosis: Multiple myeloma
  2017-Q16:
    prompts:
      - "a. Identify the image (1 mark)"
      - "b. Describe the findings (4 marks)"
      - "c. What is the diagnosis? (2 marks)"
      - "d. Mention two possible abnormal findings on a cystogram image of this case (2 marks)"
