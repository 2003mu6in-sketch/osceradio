  2017-Q22:
    prompts:
      - "a. What procedure is this?"
      - "b. Describe the findings"
      - "c. What is the diagnosis?"
      - "d. Give one complication of the condition"
      - "e. Mention one complication of the procedure"
    diagnosis: Uterine synechiae (Asherman's)
  2017-Q23:
    prompts:
      - "1. Identify the procedure"
      - "2. What is the small arrow showing?"
      - "3. What is the diagnosis?"
      - "4. Give two indications for the procedure"
    diagnosis: Broncho-/tracheo-oesophageal fistula
  2017-Q24:
