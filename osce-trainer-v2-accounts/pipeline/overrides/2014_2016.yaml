  # ---- 2015
  2015-Q01:
    stem: "Pelvic scan at 32 weeks."
    diagnosis: Cervical insufficiency
  2015-Q02:
    stem: "Pelvic scan."
    diagnosis: Placenta praevia
  2015-Q03:
    stem: "US finding."
    diagnosis: Placenta accreta
  2015-Q04: {diagnosis: "Hydrops fetalis"}
  2015-Q05:
    prompts:
      - "1. Ventriculomegaly suggests ventricles greater than … mm"
      - "2. Absence of the CSP – give 2 ddx"
      - "3. Flattening of the cerebellar hemispheres seen in Chiari II is termed …"
      - "4. Flattening of the frontal bones in Chiari II is termed …"
      - "5. Most common cause of oligohydramnios is …"
    answer: ["1. 10 mm", "2. (i) Corpus callosum agenesis (ii) Holoprosencephaly", "3. Banana sign", "4. Lemon head (lemon sign)", "5. Intrauterine growth restriction (IUGR)"]
    diagnosis: Fetal neuro-sonography facts
    modality: Ultrasound
  2015-Q06: {diagnosis: "Anencephaly"}
  2015-Q07: {diagnosis: "Alobar holoprosencephaly"}
  2015-Q08: {diagnosis: "Congenital diaphragmatic hernia"}
  2015-Q09: {diagnosis: "Duodenal atresia (double bubble)"}
  2015-Q10:
    prompts:
      - "1. Give 3 differences between gastroschisis and omphalocele"
      - "2. Physiologically herniated gut normally returns by week …"
      - "3. Large echogenic kidneys with oligohydramnios may suggest …"
      - "4. A renal pelvis > 10 mm is always abnormal. True/False"
      - "5. Sacrococcygeal teratoma is associated with what cardiac problem?"
    answer:
      - "1. Gastroschisis: (i) paraumbilical (ii) wall defect without peritoneum (iii) usually an isolated anomaly. Omphalocele: (i) midline (ii) wall defect covered with peritoneum (iii) associated with other anomalies."
      - "2. Week 12"
      - "3. Autosomal recessive polycystic kidney disease (ARPKD)"
      - "4. True"
      - "5. High-output cardiac failure"
    diagnosis: Fetal anomaly facts
    modality: Ultrasound
  2015-Q11: {diagnosis: "Posterior urethral valves (keyhole sign)"}
  2015-Q12:
    prompts:
      - "1. About trisomy 13, which is false? (a) Also known as Patau syndrome (b) Polydactyly (c) Holoprosencephaly (d) Many survive past age 1 (e) Omphalocele"
      - "2. About trisomy 18, which is false? (a) Also known as Edward syndrome (b) Rocker-bottom feet (c) Clenched hand with overlapping fingers (d) Strawberry sign (e) Cranberry sign"
      - "3. About trisomy 21, which is false? (a) Sandal gap toes (b) Duodenal atresia (c) Endocardial cushion defects (d) Increased nuchal fold > 2 mm (e) Shortened femurs"
    answer: []
    noAnswer: true
    notes:
      - "The source gives no answer key for this MCQ – only these notes:"
      - "Strawberry sign: inward bowing of the frontal bone (trisomy 18)."
      - "Nuchal fold: greater than 6 mm is the sensitive and specific sign (trisomy 21)."
    diagnosis: Trisomy 13 / 18 / 21 MCQ
    modality: Ultrasound
  2015-Q13: {diagnosis: "Right upper lobe consolidation (air bronchogram)"}
  2015-Q14: {diagnosis: "Small bowel obstruction (string of beads)"}
  2015-Q15: {diagnosis: "Normal thymus (sail sign)"}
  2015-Q16:
    prompts:
      - "1. About angiography, which is false? (a) Visualisation of vessels (b) Relatively invasive (c) Haemorrhage is a complication (d) It is only diagnostic"
      - "2. Which is false about ultrasound? (a) No ionising radiation (b) Ideal for OB/GYN and children (c) Radiofrequency is used (d) Doppler technique shows flow (e) Real-time images seen"
      - "3. Which intravenous contrast is given in an MRI study?"
      - "4. Which intravenous contrast is given in a CT study?"
      - "5. Which of the following is not a contraindication for MRI? (a) Metallic implant (b) Pacemaker (c) History of metal work, shrapnel etc. (d) Claustrophobia (e) Normal CT"
    answer:
      - "3. Gadolinium"
      - "4. Iodine compounds"
    notes: ["The source gives answers for 3 and 4 only; no answer key for 1, 2 and 5."]
    diagnosis: Imaging physics & contrast MCQ
    modality: Other

