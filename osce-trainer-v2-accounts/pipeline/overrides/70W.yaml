    images: [p40-2a]
    answer:
      - "CT imaging of traumatic subarachnoid haemorrhage and ventriculomegaly (pictures 2 and 3 are two levels in the same patient)."
      - "Demonstrates extensive intracranial air deep within the brain (black dots within the brain substance), which must be associated with a skull fracture. In addition, there is extensive subarachnoid haemorrhage around the brain stem and overlying the tentorium cerebelli, with prominence of the anterior horns of both lateral ventricles."
    diagnosis: Traumatic subarachnoid haemorrhage with intracranial air
